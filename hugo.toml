baseURL = 'https://paulbrown.net/'
locale = 'en-us'
title = 'The Firelight Studio'

theme = 'embrace'
mainsections = ['writings', 'about', 'announcements', 'services']
copyright = '2000-2026 Paul Brown. All rights reserved.'
ignoreFiles = ['^/prompts/', '^/data/hold/']

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

[params]
colorMood = "theme-dorothy"
subtitle = "by Paul Brown Massage Therapy"
tagline = 'Expert Medical Massage Therapist in Arden-Arcade, Sacramento'
description = 'Paul Brown, CMT is a licensed massage therapist in Sacramento, California specializing in medical massage therapy, myofascial release, and sports massage.'
  [params.business]
  type = ['HealthAndBeautyBusiness', 'MedicalBusiness']
  name = 'The Firelight Studio at Paul Brown Massage Therapy'
  image = 'images/png/paul-brown-massage-therapy-logo.png'
  email = 'paul@paulbrown.net'
  telephone = '916-534-8772'
  priceRange = '$$'
  paymentAccepted = ['Cash', 'Visa', 'Mastercard', 'Amex', 'HSA', 'FSA', 'Bitcoin', 'CashApp', 'PayPal', 'Venmo', 'Zelle', 'ACH']
  conditions = ['Back Pain', 'Neck Pain', 'Carpal Tunnel Syndrome', 'Fibromyalgia', 'Hip Pain', 'Anxiety', 'Depression', 'Frozen Shoulder', 'Plantar Fasciitis']
  [params.business.address]
  streetAddress = '947 Enterprise Drive, Suite 20'
  addressLocality = 'Sacramento'
  addressRegion = 'CA'
  postalCode = '95825'
  addressCountry = 'US'
  [params.business.geo]
  latitude = 38.6037
  longitude = -121.4045
  [[params.business.openingHours]]
