  [[params.business.openingHours]]
  days = ['Friday']
  opens = '10:00'
  closes = '20:00'
  [[params.business.openingHours]] 
  days = ['Saturday']
  opens = '10:00'
  closes = '20:00'
 
  [module.hugoVersion]
    extended = true
    min = '0.146.0'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'themes\embrace\assets'
    target = 'assets'
  [[module.mounts]]
    source = 'node_modules/@material-design-icons/svg/round'
