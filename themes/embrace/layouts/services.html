{{ define "main" }}
<div class="{{ index .Params "color-theme" | default "theme-auntie-em" }} w-full min-h-screen py-8 px-4 sm:px-6">
  <div class="max-w-6xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="glass-text-primary text-3xl md:text-5xl font-display font-bold mb-3">{{ .Title | default "Services & Modalities" }}</h1>
      {{ with .Description }}
      <p class="text-secondary/90 text-sm max-w-2xl mx-auto">{{ . }}</p>
      {{ end }}
    </header>

    {{ partial "organisms/conditions-grid.html" . }}
  </div>
</div>
{{ end }}
