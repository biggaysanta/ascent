<div x-data="discountModal" x-cloak>
    <!-- Modal Backdrop & Container -->
    <div x-show="showModal" 
         class="fixed inset-0 z-50 flex items-center justify-center"
         aria-labelledby="modal-title" 
         role="dialog" 
         aria-modal="true">
        
        <!-- Backdrop (Atlas can handle the click-outside logic) -->
        <div class="fixed inset-0 bg-scrim" @click="showModal = false"></div>

        <!-- Modal Content (Headless) -->
        <div class="relative bg-neutral-500 text-white border-2 border-gold elevation-3 p-8 max-w-md w-[60%]" @click.stop>
            <h2 id="modal-title">Get 15% Off Your First Appointment</h2>
            <p>Sign up for our mailing list to receive your discount code.</p>

            <!-- Mailchimp Form -->
            <div id="mc_embed_shell">
                <div id="mc_embed_signup">
                    <form @submit.prevent="alert('submitted')" action="https://paulbrown.us5.list-manage.com/subscribe/post?u=8efb521c4f3de6af4d07dce98&amp;id=6f4ed5be99&amp;f_id=00e9bfedf0" method="post" id="mc-embedded-subscribe-form" name="mc-embedded-subscribe-form" class="validate" target="_self" novalidate="">
                        <div id="mc_embed_signup_scroll">
                            <h2>"I`m with the band:"</h2>
                            <div class="indicates-required"><span class="asterisk">*</span> indicates required</div>
                            <div class="mc-field-group"><label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label><input type="email" name="EMAIL" class="required email" id="mce-EMAIL" required="" value=""></div>
                            <div class="mc-field-group"><label for="mce-FNAME">First Name </label><input type="text" name="FNAME" class=" text" id="mce-FNAME" value=""></div>
                            <div class="mc-field-group"><label for="mce-LNAME">Last Name </label><input type="text" name="LNAME" class=" text" id="mce-LNAME" value=""></div>
                            <div hidden=""><input type="hidden" name="tags" value="4848878,4848899"></div>
                            <div id="mce-responses" class="clear">
                                <div class="response" id="mce-error-response" style="display: none;"></div>
                                <div class="response" id="mce-success-response" style="display: none;"></div>
                            </div>
                            <div aria-hidden="true" style="position: absolute; left: -5000px;">
                                <input type="text" name="b_8efb521c4f3de6af4d07dce98_6f4ed5be99" tabindex="-1" value="">
                            </div>
                            <div class="clear">
                                <input type="submit" name="subscribe" id="mc-embedded-subscribe" class="button" value="Subscribe">
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            
        </div>
    </div>
</div>
