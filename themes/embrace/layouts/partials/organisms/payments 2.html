{{ $payments := hugo.Data.payments }}

<!-- Payments Section -->
<section class="border rounded-xl">
  <div class="mx-2 p-6 rounded-xl rounded-xl items-center text-center">
    <h3 class="mb-2">{{ $payments.title }}</h3>
    <p class="mb-2">{{ $payments.description }}</p>
  </div>
  <div class="grid grid-cols-2 p-2 border">
    {{ range $payments.methods }}
    <div class="flex flex-col gap-2 text-left">
      <h4>
        <span class="font-medium px-6">
          {{ with .icon }} {{ partial "atoms/icon.html" (dict "icon" . "class"
          "text-4xl")}} {{ end }} {{ .name }}</span
        >
      </h4>
      {{ with .note }}
      <p class="px-6 mb-4 last:mb-0">{{ . }}</p>
      {{ end }}
    </div>
    {{ end }}
  </div>
</section>
