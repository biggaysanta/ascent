<div class="min-w-xs max-w-6xl mx-auto px-4" x-data="{ open: false }" @keydown.escape.window="open = false">
  <div
    class="relative flex flex-col items-center justify-center py-6 border-b border-secondary/20"
  >
    <div class="relative inline-flex flex-col items-center justify-center py-4 px-6 sm:px-8 rounded-2xl bg-[url('/svg/logo.svg')] bg-left bg-no-repeat bg-contain isolate text-center gap-1.5">
      <a
        href="/"
        class="inline-flex items-center justify-center min-h-[44px] px-3 py-1 rounded-lg transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-tertiary/40 focus-visible:ring-offset-2"
        aria-label="{{ site.Title }} Home"
      >
        <h1 class="relative elevation-3 glass-text-primary text-xl sm:text-2xl font-bold font-display tracking-tight">{{ site.Title }}</h1>
      </a>
      <a
        href="/about"
        class="inline-flex items-center justify-center min-h-[44px] px-4 py-1.5 rounded-full text-xs sm:text-sm text-secondary/90 hover:text-secondary bg-secondary/10 hover:bg-secondary/20 active:bg-secondary/5 border border-secondary/20 backdrop-blur-sm transition-all duration-200 elevation-2 hover:elevation-3 active:elevation-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-secondary/40 focus-visible:ring-offset-2"
        aria-label="About {{ site.Params.subtitle }}"
      >
        <p class="m-0 font-medium tracking-wide">{{ site.Params.subtitle }}</p>
      </a>
      <p class="text-center text-tertiary elevation-2 text-xs sm:text-sm mt-1 max-w-md">
        {{ site.Params.tagline }}
      </p>
    </div>
    <button
      type="button"
      class="nav-toggle-btn flex w-full mt-4 items-center justify-center p-2 text-secondary md:hidden glass-button-secondary rounded-lg cursor-pointer"
      aria-label="Toggle navigation"
      :aria-expanded="open.toString()"
      @click="open = !open"
    >
      <svg
        class="h-6 w-6"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path x-show="!open" d="M3 6h18M3 12h18M3 18h18" />
        <path
          x-show="open"
          d="M6 6l12 12M18 6L6 18"
          x-cloak
        />
      </svg>
    </button>
  </div>

  <nav
    id="main-nav"
    class="hidden md:flex md:items-center md:justify-around md:gap-4 md:py-4 md:mb-2"
  >
    {{ partial "menu.html" (dict "menuID" "main" "pageID" .) }}
  </nav>

  <nav
    id="main-nav-mobile"
    x-show="open"
    x-cloak
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 -translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-2"
    class="md:hidden w-full pb-4"
  >
    <div
      class="w-full rounded-xl glass-panel-secondary p-3"
    >
      {{ partial "menu.html" (dict "menuID" "main" "pageID" .) }}
    </div>
  </nav>
</div>
