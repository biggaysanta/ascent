{{ define "main" }} 
<div class="{{ index .Params "color-theme" | default "theme-auntie-em" }} w-full min-h-screen py-8 px-4 sm:px-6">
  <div class="max-w-6xl mx-auto space-y-8" id="serviceswrapper">
    <header class="text-center max-w-3xl mx-auto mb-8">
      <h1 class="glass-text-primary text-3xl md:text-5xl font-display font-bold mb-3">{{ .Title | default "Services" }}</h1>
      {{ with .Content }}
      <div class="text-secondary/90 text-sm sm:text-base leading-relaxed">
        {{ . }}
      </div>
      {{ end }}
    </header>

    {{ partial "organisms/services.tabs.html" . }}
  </div>
</div>
{{ end }}
