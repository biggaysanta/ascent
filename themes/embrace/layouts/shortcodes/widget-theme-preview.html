<div class="flex flex-col gap-12 w-full max-w-7xl mx-auto my-12">
  {{ range site.Data.themes }}
  <div class="{{ .class }} p-8 bg-background border border-border rounded-xl shadow-sm">
    <h3 class="text-2xl font-bold text-text mb-6">Theme: {{ .label }}</h3>
    
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
      
      <!-- Option A: Error-Based High Urgency -->
      <div class="flex flex-col gap-4">
        <h4 class="text-lg font-semibold text-muted-text">Option A (Error / High Urgency)</h4>
        
        <div class="relative bg-background p-6 border border-subtle-border rounded-lg h-64 overflow-hidden flex flex-col justify-end">
          <!-- Main Content Mock -->
          <div class="absolute inset-0 p-4 opacity-50 space-y-3 pointer-events-none">
             <div class="h-4 bg-border rounded w-3/4"></div>
             <div class="h-4 bg-border rounded w-1/2"></div>
             <div class="h-4 bg-border rounded w-5/6"></div>
             <div class="h-4 bg-border rounded w-2/3"></div>
          </div>
          
          <!-- The Widget (Responsive Slide-in / Sticky) -->
          <div class="relative z-10 w-full sm:w-80 self-end sm:mb-4 sm:mr-4 transform transition-transform duration-500 hover:-translate-y-1">
            <div class="bg-error/10 border border-error/20 backdrop-blur-sm shadow-lg rounded-lg p-5 flex flex-col gap-3">
              <h5 class="font-bold text-error-text text-xl leading-tight">Flash Sale Ends Tonight!</h5>
              <p class="text-sm text-error-text/80">Book your next massage and get 20% off.</p>
              <button class="mt-2 bg-error text-on-error px-4 py-2 rounded font-semibold shadow-md hover:shadow-lg active:shadow-sm transition-all self-start">
                Claim Offer
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Option B: Tertiary-Based High Contrast -->
      <div class="flex flex-col gap-4">
        <h4 class="text-lg font-semibold text-muted-text">Option B (Tertiary / High Contrast)</h4>
        
        <div class="relative bg-background p-6 border border-subtle-border rounded-lg h-64 overflow-hidden flex flex-col justify-end">
          <!-- Main Content Mock -->
          <div class="absolute inset-0 p-4 opacity-50 space-y-3 pointer-events-none">
             <div class="h-4 bg-border rounded w-3/4"></div>
             <div class="h-4 bg-border rounded w-1/2"></div>
             <div class="h-4 bg-border rounded w-5/6"></div>
             <div class="h-4 bg-border rounded w-2/3"></div>
          </div>
          
          <!-- The Widget (Responsive Slide-in / Sticky) -->
          <div class="relative z-10 w-full sm:w-80 self-end sm:mb-4 sm:mr-4 transform transition-transform duration-500 hover:-translate-y-1">
            <div class="bg-tertiary/10 border border-tertiary/20 backdrop-blur-sm shadow-lg rounded-lg p-5 flex flex-col gap-3">
              <h5 class="font-bold text-tertiary-text text-xl leading-tight">Exclusive Offer Inside</h5>
              <p class="text-sm text-tertiary-text/80">Book your next massage and get 20% off.</p>
              <button class="mt-2 bg-tertiary text-on-tertiary px-4 py-2 rounded font-semibold shadow-md hover:shadow-lg active:shadow-sm transition-all self-start">
                Unlock Offer
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
  {{ end }}
</div>
