services:
  web:
    build: .
    container_name: ascent-web
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "com.example.description=Ascent static site"

  # Development service with hot reload
  dev:
    build: .
    container_name: ascent-dev
    ports:
      - "3000:80"
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    develop:
      watch:
        - action: sync
          path: ./assets
          target: /app/assets
        - action: sync
          path: ./content
          target: /app/content
        - action: sync
          path: ./layouts
          target: /app/layouts
        - action: rebuild
          path: ./package.json
